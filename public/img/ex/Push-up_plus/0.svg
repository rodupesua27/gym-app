<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Push-up plus: posición inicial">
  <rect width="480" height="320" fill="#141414"/>
  <line x1="40" y1="282" x2="440" y2="282" stroke="#333" stroke-width="4"/>
  <!-- cuerpo en plancha alta, brazos rectos -->
  <line x1="150" y1="130" x2="150" y2="240" stroke="#eee" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="130" x2="360" y2="160" stroke="#eee" stroke-width="8" stroke-linecap="round"/>
  <line x1="360" y1="160" x2="430" y2="262" stroke="#eee" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="130" x2="360" y2="160" stroke="none"/>
  <circle cx="122" cy="108" r="20" fill="#eee"/>
  <line x1="150" y1="130" x2="110" y2="250" stroke="#eee" stroke-width="7" stroke-linecap="round"/>
  <line x1="110" y1="250" x2="140" y2="250" stroke="#eee" stroke-width="7" stroke-linecap="round"/>
  <!-- serrato resaltado en las costillas -->
  <ellipse cx="215" cy="155" rx="26" ry="18" fill="#7b1e2b" fill-opacity=".35" stroke="#7b1e2b" stroke-width="2"/>
  <text x="240" y="40" fill="#7b1e2b" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Inicio</text>
  <text x="240" y="66" fill="#999" font-family="system-ui,sans-serif" font-size="16">Escápulas juntas, brazos rectos</text>
</svg>
