<style>#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}#splash.out{opacity:0;pointer-events:none}#splash video{width:min(100vw,100vh,960px);height:min(100vw,100vh,960px);object-fit:contain;background:#000;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 12%,#000 88%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 12%,#000 88%,transparent 100%);mask-composite:intersect}</style>
</head>
<body>
<div id="splash"><video id="splashv" src="/splash4.mp4" poster="/splash4.jpg" muted playsinline autoplay preload="auto"></video></div>
<script>
(function(){
  var sp=document.getElementById('splash'),v=document.getElementById('splashv');
  if(!sp)return;
  var t0=Date.now(),gone=false,lastT=-1,stillMs=0;
  function hide(){ if(gone)return; gone=true; sp.classList.add('out'); setTimeout(function(){ if(sp.parentNode)sp.parentNode.removeChild(sp); },500); }
  v.addEventListener('ended',hide);
  sp.addEventListener('click',hide);
  v.addEventListener('error',hide);
  // No esperamos a que cargue toda la página: la app se ve en cuanto acaba el vídeo o si se atasca
  var timer=setInterval(function(){
    if(gone){ clearInterval(timer); return; }
    var el=Date.now()-t0;
    if(v.currentTime>lastT+0.02){ lastT=v.currentTime; stillMs=0; } else { stillMs+=250; }
    if(stillMs>=1500 && el>1500) hide();   // vídeo congelado o sin cargar
    if(el>=4800) hide();                    // tope absoluto
  },250);
  var pr=v.play&&v.play(); if(pr&&pr.catch)pr.catch(hide);
})();
</script>
