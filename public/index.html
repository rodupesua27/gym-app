<style>#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}#splash.out{opacity:0;pointer-events:none}#splash video{width:min(100vw,100vh,640px);height:min(100vw,100vh,640px);object-fit:contain;background:#000}</style>
</head>
<body>
<div id="splash"><video id="splashv" src="/splash2.mp4" poster="/splash2.jpg" muted playsinline autoplay preload="auto"></video></div>
<script>
(function(){
  var sp=document.getElementById('splash'),v=document.getElementById('splashv');
  if(!sp)return;
  var ready=false,ended=false,gone=false;
  function hide(){ if(gone)return; gone=true; sp.classList.add('out'); setTimeout(function(){ if(sp.parentNode)sp.parentNode.removeChild(sp); },600); }
  function check(){ if(ready&&ended)hide(); }
  window.addEventListener('load',function(){ ready=true; check(); });
  v.addEventListener('ended',function(){ ended=true; check(); });
  v.addEventListener('error',function(){ ended=true; check(); });
  sp.addEventListener('click',function(){ ended=true; check(); });
  var pr=v.play&&v.play(); if(pr&&pr.catch)pr.catch(function(){ setTimeout(function(){ ended=true; check(); },1500); });
  setTimeout(hide,9000);
})();
</script>
