<style>#splash{position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}#splash.out{opacity:0;pointer-events:none}#splash video{width:min(100vw,100vh,720px);height:min(100vw,100vh,720px);object-fit:contain;background:#000}</style>
</head>
<body>
<div id="splash"><video id="splashv" src="/splash5.mp4" poster="/splash5.jpg" muted playsinline autoplay preload="auto"></video></div>
<script>
(function(){
  var sp=document.getElementById('splash'),v=document.getElementById('splashv');
  if(!sp)return;
  var t0=Date.now(),gone=false,lastT=0,stillMs=0,started=false;
  function hide(){ if(gone)return; gone=true; sp.classList.add('out'); setTimeout(function(){ if(sp.parentNode)sp.parentNode.removeChild(sp); },500); }
  v.addEventListener('ended',hide);
  v.addEventListener('error',hide);
  sp.addEventListener('click',hide);
  var timer=setInterval(function(){
    if(gone){ clearInterval(timer); return; }
    var el=Date.now()-t0;
    if(v.currentTime>0.05) started=true;
    if(started){
      if(v.currentTime>lastT+0.02){ lastT=v.currentTime; stillMs=0; } else { stillMs+=250; }
      if(stillMs>=1500) hide();          // se ha parado a mitad: no dejar la pantalla congelada
    }
    if(el>=4800) hide();                 // tope absoluto
  },250);
  var pr=v.play&&v.play(); if(pr&&pr.catch)pr.catch(hide);
})();
</script>
